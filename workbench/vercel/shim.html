<script>
/* Vercel: the local server's calls answered from data.json and the /api store, polled gently */
(() => { const real = window.fetch.bind(window), J = (o) => new Response(JSON.stringify(o), { headers: { 'Content-Type': 'application/json' } }); let D = null, last = null, at = 0, bust = 0; const load = real('/data.json').then((r) => r.json()).then((d) => { D = d; });
  const post = (u, b) => real(u, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: b }).then((r) => r.json());
  window.fetch = async (u, o) => { if (u === '/catalog.json') { await load; return J(D.cat); } if (u === '/config.json') { await load; return J(D.cfg || {}); } if (u === '/state.json') { await load; if (!last || Date.now() - at > 15000) { at = Date.now(); last = await real('/api/state' + (bust ? '?b=' + bust : '')).then((r) => r.ok ? r.json() : last || {}).catch(() => last || {}); } const L = last.live || {}; return J(Object.assign({ tasks: {}, grades: [], numbers: [], ships: [], dirty: [], running: [], build: '', shipAge: 0 }, L, { now: L.updated ? 'updated ' + L.updated : '', shots: D.shots, clips: D.clips, notes: last.notes || [] })); } if (u === '/note') { const n = await post('/api/note', o.body); bust = Date.now(); at = 0; return J(n); } if (u === '/note/remove') { const b = JSON.parse(o.body); await post('/api/note', JSON.stringify({ id: b.id, remove: true })); bust = Date.now(); at = 0; return J({}); } return real(u, o); }; })();
</script>
