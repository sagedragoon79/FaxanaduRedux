<style>
/* a workshop for a game in progress: rail left, working surface right, a drawer for the thing in hand. Colours and display font come from config.json so it can match the game's own menus */
:root { --bg: #0a0c0e; --rail: #0f1215; --panel: #14181c; --panel2: #1a1f24; --line: #272d33; --disp: Georgia; --body: Inter; --gold: #d8b970; --goldd: #8a7443; --fg: #ece6d8; --mut: #8e8a7e; --new: #e8953c; --ok: #6fc29a; --bad: #e0705a; --r0: #c9c4b6; --r1: #5fa8ec; --r2: #b277ea; --r3: #eda23c; --soft: #c4bfb2; --on: #fff; --flavc: #bdb6a5; --track: #23292f; --well: radial-gradient(circle at 50% 42%, #242a30, #101316); --sendh: #ecd28f; color-scheme: dark; }
* { box-sizing: border-box; } html, body { height: 100%; } body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.45 var(--body), system-ui, sans-serif; }
.app { display: grid; grid-template-columns: 216px minmax(0, 1fr); height: 100%; }
nav { background: var(--rail); border-right: 1px solid var(--line); padding: 18px 0; overflow: auto; display: flex; flex-direction: column; gap: 2px; }
.logo { font: 700 17px var(--disp), Georgia, serif; letter-spacing: .16em; padding: 0 18px; color: var(--gold); } .logo small { display: block; font: 500 10px var(--body), sans-serif; letter-spacing: .2em; color: var(--mut); margin: 3px 0 14px; }
.group { font-size: 10px; letter-spacing: .2em; color: var(--mut); padding: 14px 18px 5px; text-transform: uppercase; }
nav button { all: unset; cursor: pointer; display: flex; justify-content: space-between; align-items: center; padding: 7px 18px; color: var(--soft); border-left: 2px solid transparent; font-size: 14px; } nav button:hover { background: var(--panel); color: var(--fg); } nav button:focus-visible { outline: 1px solid var(--gold); outline-offset: -1px; } nav button.on { color: var(--on); border-left-color: var(--gold); background: var(--panel); }
nav i { font: 500 11px var(--body), sans-serif; color: var(--mut); font-style: normal; font-variant-numeric: tabular-nums; } nav i.hot { background: var(--new); color: #1a1208; border-radius: 9px; padding: 0 7px; font-weight: 600; }
.status { margin-top: auto; padding: 12px 18px 2px; font-size: 12px; color: var(--mut); } .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--ok); margin-right: 6px; } .off .dot { background: var(--bad); }
main { overflow: auto; padding: 22px clamp(16px, 2.4vw, 36px) 60px; min-width: 0; }
.head { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: end; justify-content: space-between; margin-bottom: 16px; } h1 { font: 600 24px var(--disp), Georgia, serif; letter-spacing: .08em; margin: 0; } .lede { font: italic 17px 'EB Garamond', Georgia, serif; color: var(--mut); margin: 2px 0 0; }
h2 { font: 600 12px var(--disp), Georgia, serif; letter-spacing: .16em; color: var(--gold); margin: 0 0 10px; text-transform: uppercase; }
.tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 14px; } input[type=search], select, textarea { background: var(--panel); border: 1px solid var(--line); color: var(--fg); border-radius: 6px; padding: 7px 10px; font: inherit; } input[type=search] { width: min(320px, 100%); } input:focus, select:focus, textarea:focus { outline: 1px solid var(--goldd); }
.chip { all: unset; cursor: pointer; padding: 4px 11px; border: 1px solid var(--line); border-radius: 14px; font-size: 13px; color: var(--soft); } .chip:hover { border-color: var(--goldd); } .chip.on { background: var(--gold); color: #17130a; border-color: var(--gold); font-weight: 600; } .chip:focus-visible { outline: 1px solid var(--gold); }
.grid { display: grid; gap: 10px; align-items: start; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); } .grid.wide { grid-template-columns: repeat(auto-fill, minmax(min(100%, 270px), 1fr)); }

.tile img { display: block; width: 100%; aspect-ratio: 1; object-fit: contain; background: var(--well); } .wide .tile img { aspect-ratio: 16/9; object-fit: cover; }
.tile b { display: block; font-weight: 500; padding: 7px 9px 1px; font-size: 13.5px; overflow-wrap: anywhere; } .tile span { display: block; padding: 0 9px 8px; color: var(--mut); font-size: 12px; } .pin { position: absolute; top: 6px; right: 6px; background: var(--new); color: #1a1208; border-radius: 9px; padding: 0 7px; font: 600 11px var(--body), sans-serif; }
.r0 b { color: var(--r0); } .r1 b { color: var(--r1); } .r2 b { color: var(--r2); } .r3 b { color: var(--r3); }
table { width: 100%; border-collapse: collapse; } th { position: sticky; top: 0; background: var(--panel2); text-align: left; font: 500 12px var(--body), sans-serif; color: var(--mut); padding: 7px 9px; cursor: pointer; white-space: nowrap; } td { padding: 7px 9px; border-top: 1px solid var(--line); vertical-align: top; } tr.rowb { cursor: pointer; } tr.rowb:hover td { background: var(--panel); } td.n { font-variant-numeric: tabular-nums; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px; min-width: 0; } .cols { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); } .stack { display: grid; gap: 14px; }
.stats { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); } .stat b { display: block; font: 500 28px var(--disp), Georgia, serif; font-variant-numeric: tabular-nums; } .stat span { color: var(--mut); font-size: 12px; } .stat.me b { color: var(--bad); }

.run { color: var(--new); font-size: 13px; margin-top: 8px; } .mut { color: var(--mut); font-size: 13px; }
.bar { display: grid; grid-template-columns: 100px 1fr 30px; gap: 8px; align-items: center; font-size: 13px; margin-bottom: 7px; } .tr { height: 9px; background: var(--track); border-radius: 5px; overflow: hidden; } .tr i { display: block; height: 100%; background: var(--gold); } .bar.low .tr i { background: var(--bad); }
.media { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr)); } figure { margin: 0; min-width: 0; } figure img, figure video { width: 100%; display: block; border-radius: 6px; background: #000; aspect-ratio: 16/9; object-fit: cover; cursor: pointer; } figcaption { color: var(--mut); font-size: 12px; margin-top: 4px; }
svg text { fill: var(--mut); font-size: 11px; }
#drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(440px, 100%); background: var(--rail); border-left: 1px solid var(--goldd); padding: 16px; overflow: auto; transform: translateX(102%); transition: transform .18s ease-out; z-index: 4; display: flex; flex-direction: column; gap: 10px; } #drawer.open { transform: none; } @media (prefers-reduced-motion: reduce) { #drawer { transition: none; } }
#drawer img, #drawer video { width: 100%; border-radius: 6px; background: var(--well); max-height: 44vh; object-fit: contain; } #drawer h3 { font: 600 19px var(--disp), Georgia, serif; margin: 0; } .x { all: unset; cursor: pointer; align-self: flex-end; color: var(--mut); font-size: 13px; } .x:hover { color: var(--fg); }
dl { display: grid; grid-template-columns: 90px 1fr; gap: 3px 10px; margin: 0; font-size: 13px; } dt { color: var(--mut); } dd { margin: 0; overflow-wrap: anywhere; } .flav { font: italic 16px 'EB Garamond', Georgia, serif; color: var(--flavc); }
.compose { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px; display: grid; gap: 8px; } .compose textarea { width: 100%; min-height: 76px; resize: vertical; } .kinds { display: flex; flex-wrap: wrap; gap: 6px; } .send { all: unset; cursor: pointer; background: var(--gold); color: #17130a; font-weight: 600; padding: 7px 14px; border-radius: 6px; justify-self: start; } .send:hover { background: var(--sendh); } .send:focus-visible { outline: 2px solid #fff; }
.note { border: 1px solid var(--line); border-left: 3px solid var(--new); border-radius: 6px; padding: 8px 10px; background: var(--panel); } .note.seen { border-left-color: var(--gold); } .note.done { border-left-color: var(--ok); opacity: .8; } .note .m { display: flex; flex-wrap: wrap; gap: 4px 10px; justify-content: space-between; font-size: 12px; color: var(--mut); } .note p { margin: 4px 0 0; white-space: pre-wrap; overflow-wrap: anywhere; } .note .rep { color: var(--ok); font-size: 13px; } .tag { color: var(--gold); } .del { all: unset; cursor: pointer; color: var(--mut); font-size: 12px; } .del:hover { color: var(--bad); } .link { all: unset; cursor: pointer; color: var(--gold); }
@media (max-width: 760px) { .app { grid-template-columns: 1fr; grid-template-rows: auto 1fr; } nav { flex-direction: row; overflow-x: auto; padding: 8px; border-right: 0; border-bottom: 1px solid var(--line); } .logo, .group, .status { display: none; } nav button { border-left: 0; white-space: nowrap; } }
</style></head><body><div class="app"><nav id="nav"></nav><main id="main"></main></div><aside id="drawer" aria-label="Details"></aside>

function render() { const m = $('main'), set = SETS()[S.tab], st = S.st; nav(); const keep = document.activeElement && document.activeElement.id === 'q' ? 'q' : null; if (S.live === S.tab && !set && S.tab !== 'now' && S.tab !== 'inbox') {} if (document.activeElement && document.activeElement.tagName === 'TEXTAREA' && m.contains(document.activeElement)) return; m.replaceChildren(); if (set) return catalog(m, S.tab, set); const g = st.grades || [], T = st.tasks || {};
 if (S.tab === 'now') { m.appendChild(head('Right now', 'What I am doing, what is next, and where to steer me.')); const stats = E('div', 'stats'); for (const [v, l, c] of [[st.owner ? st.owner + ' / 10' : '–', 'Your rating, the one that counts', 'me'], [g.length ? g[g.length - 1].overall.toFixed(1) : '–', 'Latest independent grade', ''], [st.build || '–', 'Latest build' + (st.shipAge ? ', ' + ago(st.shipAge) : ''), ''], [(st.notes || []).filter((n) => n.status === 'new').length, 'Your notes waiting for me', '']]) { const d = E('div', 'card stat ' + c); d.append(E('b', '', v), E('span', '', l)); stats.appendChild(d); } const wrap = E('div', 'stack'); wrap.appendChild(stats); const cols = E('div', 'cols'), a = E('div', 'card doing'); a.appendChild(E('h2', '', 'Working on')); const u = E('ul', 'plain'); (T.doing || []).forEach((x) => { const li = E('li', '', x.t); if (x.why) li.appendChild(E('small', '', x.why)); u.appendChild(li); }); a.appendChild(u); a.appendChild(E('div', 'run', (st.running || []).length ? 'Running now: ' + st.running.map((x) => x.name + (x.for ? ' (' + x.for + ')' : '')).join(', ') : 'No test running this second')); a.appendChild(E('div', 'mut', (st.dirty || []).length ? 'Unshipped edits: ' + st.dirty.join(', ') : 'Everything built so far is shipped')); const b = E('div', 'card q'); b.appendChild(E('h2', '', 'In the queue')); const q = E('ul', 'plain'); (T.queue || []).forEach((x, i) => { const li = E('li'); li.append(E('span', '', i + 1), E('div', '', x)); q.appendChild(li); }); b.appendChild(q); const c = E('div', 'card'); c.appendChild(E('h2', '', 'Tell me something')); c.appendChild(composer('General', 'now', '', true)); cols.append(a, b, c); wrap.appendChild(cols); const d2 = E('div', 'cols'), e1 = E('div', 'card'); e1.appendChild(E('h2', '', 'Done lately')); const dn = E('ul', 'plain'); dn.style.color = 'var(--ok)'; (T.done || []).slice(0, 8).forEach((x) => dn.appendChild(E('li', '', x))); e1.appendChild(dn); const e2 = E('div', 'card'); e2.appendChild(E('h2', '', 'Stuck on')); const sk = E('ul', 'plain'); sk.style.color = 'var(--bad)'; (T.stuck || []).forEach((x) => sk.appendChild(E('li', '', x))); e2.appendChild(sk); d2.append(e1, e2); wrap.appendChild(d2); m.appendChild(wrap); }
 if (S.tab === 'inbox') { m.appendChild(head('Your notes', 'Everything you have sent me, and what happened to it. I read these at the top of every round.')); const w = E('div', 'stack'), c = E('div', 'card'); c.appendChild(E('h2', '', 'New note')); c.appendChild(composer('General', 'inbox', '', true)); w.appendChild(c); const L = [...(st.notes || [])].reverse(); if (!L.length) w.appendChild(E('p', 'mut', 'Nothing yet. Open any item, person or place and leave a note on it.')); L.forEach((n) => w.appendChild(noteEl(n, true))); m.appendChild(w); }
 if (S.tab === 'ratings') { m.appendChild(head('Ratings', 'Independent reviews, plus your own number.')); const w = E('div', 'cols'), a = E('div', 'card'), b = E('div', 'card'); a.appendChild(E('h2', '', 'Grade over time')); const t = E('div'); a.appendChild(t); a.appendChild(E('p', 'mut', 'Red dashes are your rating. An independent grader only sees what it is shown, so yours counts more.')); b.appendChild(E('h2', '', 'Latest by area')); bars(b, g); w.append(a, b); m.appendChild(w); trend(t, g, st.owner); const tb = E('table'), h = E('tr'); ['Time', 'Grade', 'Note'].forEach((x) => h.appendChild(E('th', '', x))); tb.appendChild(h); [...g].reverse().forEach((d) => { const r = E('tr'); r.append(E('td', 'n', d.t), E('td', 'n', d.overall.toFixed(1)), E('td', '', d.note)); tb.appendChild(r); }); const c = E('div', 'card'); c.style.marginTop = '14px'; c.appendChild(tb); m.appendChild(c); }
 if (S.tab === 'media') { m.appendChild(head('Video and GIFs', 'Recorded from the game itself.')); const c = E('div', 'media'); m.appendChild(c); mediaGrid(c, st.clips || [], (x) => x.name.replace(/\.\w+$/, '').replace(/-/g, ' ') + ' · ' + ago(x.age)); if (!(st.clips || []).length) m.appendChild(E('p', 'mut', 'Clips are being recorded. They appear here by themselves.')); }
 if (S.tab === 'shots') { m.appendChild(head('Latest screenshots', 'The newest images, as the tests take them.')); const c = E('div', 'media'); m.appendChild(c); mediaGrid(c, st.shots || [], (x) => x.name + ' · ' + ago(x.age)); }
 if (S.tab === 'shipped') { m.appendChild(head('Shipped', 'Every recent change to the game.')); const tb = E('table'), h = E('tr'); ['Time', 'Build', 'Change'].forEach((x) => h.appendChild(E('th', '', x))); tb.appendChild(h); (st.ships || []).forEach((d) => { const r = E('tr'); r.append(E('td', 'n', d.t), E('td', 'n', d.h), E('td', '', d.s)); tb.appendChild(r); }); const c = E('div', 'card'); c.appendChild(tb); m.appendChild(c); }
 if (S.tab === 'numbers') { m.appendChild(head('Measured numbers', 'Measured from the game, not guessed.')); const w = E('div', 'stack'); for (const t of st.numbers || []) { const c = E('div', 'card'); c.appendChild(E('h2', '', t.title || '')); const tb = E('table'), h = E('tr'); (t.columns || []).forEach((x) => h.appendChild(E('th', '', x))); tb.appendChild(h); for (const row of t.rows || []) { const r = E('tr'); row.forEach((x) => r.appendChild(E('td', '', x))); tb.appendChild(r); } c.appendChild(tb); w.appendChild(c); } const n = E('div', 'card'); n.appendChild(E('h2', '', 'Tell me how it feels')); n.appendChild(composer('Feel', 'numbers', 'numbers:feel', true)); w.appendChild(n); m.appendChild(w); } if (keep) { const e = $(keep); if (e) e.focus(); } }
const VIEWKEY = (s, tab) => JSON.stringify(tab === 'now' ? [s.tasks, s.running, s.dirty, s.build, s.grades.length, s.notes.length, s.notes.filter((n) => n.status === 'new').length] : tab === 'inbox' ? s.notes : tab === 'ratings' ? s.grades.length : tab === 'media' ? s.clips.map((c) => c.url) : tab === 'shots' ? s.shots.map((c) => c.url) : tab === 'shipped' ? s.ships.length : tab === 'numbers' ? [s.notes.length, s.numbers] : 0);

async function tick() { try { const s = await (await fetch('/state.json', { cache: 'no-store' })).json(), notesWas = JSON.stringify(S.st.notes || []), wasV = S.st.grades ? VIEWKEY(S.st, S.tab) : ''; S.st = s; S.off = false; let again = false; if (!S.cfg.game) { try { S.cfg = await (await fetch('/config.json', { cache: 'no-store' })).json(); theme(); again = true; } catch (e) {} } try { const c = await (await fetch('/catalog.json', { cache: 'no-store' })).json(), v = c.made || JSON.stringify((c.sections || []).map((x) => (x.rows || []).length)); if (v !== S.catV) { S.catV = v; S.cat = c; again = true; } } catch (e) {} const nowV = VIEWKEY(s, S.tab), isSet = !!SETS()[S.tab]; if (again || (!isSet && wasV !== nowV)) render(); else { nav(); if (isSet && notesWas !== JSON.stringify(s.notes)) { const b = document.querySelector('#cbody'); if (b) render(); } } if (S.cur && notesWas !== JSON.stringify(s.notes)) drawer(); } catch (e) { S.off = true; nav(); } }
function theme() { const T = S.cfg.theme || {}, R = document.documentElement.style, N = { gold: '--gold', goldDim: '--goldd', bg: '--bg', rail: '--rail', panel: '--panel', panel2: '--panel2', line: '--line', text: '--fg', muted: '--mut', soft: '--soft', active: '--on', flavour: '--flavc', track: '--track', well: '--well', sendHover: '--sendh', ok: '--ok', bad: '--bad', fresh: '--new', r0: '--r0', r1: '--r1', r2: '--r2', r3: '--r3', scheme: 'color-scheme' }; for (const k in N) if (T[k]) R.setProperty(N[k], T[k]); if (T.display) R.setProperty('--disp', "'" + T.display + "'"); if (T.body) R.setProperty('--body', "'" + T.body + "'"); if (T.fontUrl) { const l = document.createElement('link'); l.rel = 'stylesheet'; l.href = T.fontUrl; document.head.appendChild(l); } document.title = (S.cfg.game || '') + ' Workbench'; }
addEventListener('hashchange', () => { const k = location.hash.slice(1) || 'now'; if (k !== S.tab) { S.tab = k; S.q = ''; S.sort = null; closeDrawer(); render(); } }); addEventListener('keydown', (e) => { if (e.key === 'Escape') closeDrawer(); }); nav(); render(); tick(); setInterval(tick, 3000);
