name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot
        run: |
          VERSION="$(cat tools/godot-version.txt)"
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${VERSION}/Godot_v${VERSION}_linux.x86_64.zip"
          unzip -q godot.zip
          mv "Godot_v${VERSION}_linux.x86_64" "$HOME/godot"
          chmod +x "$HOME/godot"
          "$HOME/godot" --version

      - name: Run tests
        run: GODOT="$HOME/godot" tools/run_tests.sh

      - name: Capture screenshots
        timeout-minutes: 12
        continue-on-error: true
        run: |
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri >/dev/null
          mkdir -p shots
          export GODOT="$HOME/godot"
          tools/screenshot.sh shots/gym-start.png
          tools/screenshot.sh shots/gym-pogo-corridor.png 36,39
          tools/screenshot.sh shots/gym-shaft.png 83,30
          tools/screenshot.sh shots/gym-thorn-bulbs.png 134,17
          for f in levels/*/*.room; do
            id="${f#levels/}"; id="${id%.room}"
            [[ "$id" == gym/* ]] && continue
            tools/screenshot.sh "shots/${id//\//-}.png" - "$id" || true
          done

      # Screenshots are a convenience: a full artifact quota must not fail CI.
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          retention-days: 3
          name: screenshots
          path: shots/
          if-no-files-found: ignore

  mix:
    # The mix check (design bible 13): no sound or track clips or strays from its group.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # A slow apt mirror once hung this step until the job's 10 minutes ran
      # out (PR #506): each try now gets 4 minutes, and a stalled one is retried.
      - name: Install ffmpeg and numpy
        timeout-minutes: 9
        run: |
          for try in 1 2; do
            if timeout 240 sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update -qq \
              && timeout 240 sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y -qq --no-install-recommends ffmpeg >/dev/null; then
              break
            fi
            echo "apt try $try stalled or failed; retrying"
          done
          command -v ffmpeg
          pip install -q numpy

      - name: Check the mix
        run: python3 tools/audio/levels.py --check
